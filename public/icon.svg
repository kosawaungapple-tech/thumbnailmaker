<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />

  <!-- Outer Neon Border -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="url(#accentGrad)" stroke-width="8" opacity="0.6" />

  <!-- Thumbnail Viewport Frame -->
  <rect x="68" y="104" width="376" height="236" rx="32" fill="#18181b" stroke="url(#accentGrad)" stroke-width="12" filter="url(#glow)" />

  <!-- Mountain/Landscape Silhouette inside frame -->
  <path d="M 96 290 L 190 190 L 270 260 L 330 210 L 416 290 Z" fill="url(#accentGrad)" opacity="0.85" />
  <circle cx="360" cy="160" r="28" fill="#facc15" />

  <!-- Play / Sparkle badge -->
  <circle cx="256" cy="380" r="54" fill="url(#accentGrad)" />
  <polygon points="244,358 244,402 280,380" fill="#ffffff" />

  <!-- Top Stars/Sparkles -->
  <path d="M 120 70 L 126 84 L 140 90 L 126 96 L 120 110 L 114 96 L 100 90 L 114 84 Z" fill="#60a5fa" />
  <path d="M 390 60 L 394 72 L 406 76 L 394 80 L 390 92 L 386 80 L 374 76 L 386 72 Z" fill="#f472b6" />
</svg>
